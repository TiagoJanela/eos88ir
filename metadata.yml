Identifier: eos88ir
Slug: chemical-dice-embeddings
Status: In progress
Title: Chemical Dice Molecular Embeddings
Description: Embeds a molecule as an 8192-dimensional vector computed from its 
  SMILES alone. The authors fused six views of each molecule (Mordred 
  descriptors, GROVER graph features, ImageMol images, Signaturizer bioactivity 
  signatures, MOPAC quantum properties and ChemBERTa language features) into a 
  teacher embedding, then trained a Mamba state-space model on about 2.2 million
  ChEMBL molecules to predict it, so only the SMILES is needed. SMILES longer 
  than 128 tokens are truncated.
